<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0085ca" />
    <!-- Google, Slack and iMessage ask for /favicon.ico by name and don't
         reason about the SVG, so the .ico has to exist as a real file. The
         PNGs are the square fallback for anything that skips both. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <!-- iOS ignores SVG here and wants a real bitmap on its own ground, so this
         is the launcher icon rather than the tab mark. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Panthers" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Panthers Portal</title>
    <!-- Every client-side route is served from this one document, so without a
         canonical each of them looks to a crawler like a separate page with
         identical markup. backend/main.py rewrites this per route. -->
    <link rel="canonical" href="https://panthers-portal.onrender.com/" />
    <meta
      name="description"
      content="Carolina Panthers news, live scores, schedule and roster — the official feed and ESPN's, merged."
    />

    <!-- Link previews. Every scraper that matters (iMessage, Slack, Discord,
         WhatsApp, X) fetches the HTML and never runs the bundle, so these have
         to be in the served document — React can't put them here later. The
         image URL is absolute for the same reason: there's no page context to
         resolve a relative one against.

         backend/main.py rewrites this block per route for /article/{id} and
         /game/{event_id}; the values below are what everything else gets. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Panthers Portal" />
    <meta property="og:title" content="Panthers Portal" />
    <meta
      property="og:description"
      content="Carolina Panthers news, live scores, schedule and roster — the official feed and ESPN's, merged."
    />
    <meta property="og:url" content="https://panthers-portal.onrender.com/" />
    <meta
      property="og:image"
      content="https://panthers-portal.onrender.com/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Panthers Portal — news, scores, schedule and roster."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the stored theme before first paint so light mode doesn't flash dark.
      var t = localStorage.getItem("panthers-portal-theme");
      document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
    </script>
    <link rel="preconnect" href="https://static.cloudflareinsights.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics. Pageviews only, no cookies, so there is
         nothing to consent to and no banner to show.

         The token is inline rather than an environment variable because Vite
         inlines at build time: a value set on the Render service would never
         reach the bundle, only one passed as a Docker build arg would. It is
         a public identifier either way — every site using this ships it in
         its markup — so the indirection would buy nothing.

         "spa" has to be set explicitly. Without it the beacon reports one
         pageview per document and stops, which for this app means the four
         tabs a visitor clicks through after landing are invisible — every
         route here is a pushState, not a document load. With it the beacon
         wraps history.pushState and listens for popstate, which is exactly
         how router.ts moves; our routes are real paths, not hashes, which is
         the case it supports. Check window.__cfBeacon.load in the console:
         "spa" is right, "single" means this attribute got dropped. -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "66b323db89864aaeb54fd7ff6adace72", "spa": true}'
    ></script>
  </body>
</html>
